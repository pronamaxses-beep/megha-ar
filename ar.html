<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Megha House AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #C8D8DC; /* same grey as sky so no black flash */
    }

    /* ── This is the KEY fix for black screen on Android ── */
    #scene-wrap {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
    }
    #scene-wrap a-scene {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    /* Force the WebGL canvas to fill the wrapper */
    #scene-wrap a-scene canvas {
      width: 100vw !important;
      height: 100vh !important;
      position: absolute !important;
      top: 0 !important; left: 0 !important;
    }

    /* ── GEO OVERLAY (on top of scene) ── */
    #geo-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #060C1A;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 30px; color: white;
      font-family: Arial, sans-serif;
      transition: opacity 0.7s ease;
    }
    #geo-overlay.gone { opacity:0; pointer-events:none; }
    #geo-overlay h2 {
      font-size: 2rem; font-weight: 900; letter-spacing: 4px;
      background: linear-gradient(135deg,#1E6FFF,#FFD700);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom: 8px;
    }
    #geo-overlay p { color:rgba(255,255,255,.55); font-size:.9rem; line-height:1.7; margin-top:10px; }
    .spin {
      width:50px; height:50px; margin:20px auto;
      border:3px solid rgba(30,111,255,.2);
      border-top-color:#1E6FFF; border-radius:50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ── DENIED ── */
    #denied {
      position:fixed; inset:0; z-index:999;
      background:#060C1A; color:white;
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:30px;
      font-family:Arial,sans-serif;
    }
    #denied h2 { color:#FF4B4B; font-size:2rem; margin-bottom:14px; }
    #denied p  { color:rgba(255,255,255,.6); line-height:1.7; }
    #denied .km { font-size:1.6rem; font-weight:700; color:#FFD700; margin:12px 0; }

    /* ── TOP BAR ── */
    #topbar {
      position:fixed; top:0; left:0; right:0; z-index:50;
      padding:14px 20px;
      display:none; justify-content:space-between; align-items:center;
      background:linear-gradient(to bottom,rgba(6,12,26,.85),transparent);
      font-family:Arial,sans-serif; pointer-events:none;
    }
    #topbar span { font-weight:900; font-size:1rem; color:white; letter-spacing:3px; }
    .dot { width:9px; height:9px; background:#00E676; border-radius:50%;
           animation:blink 1.5s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── MUSIC BUTTON ── */
    #mbtn {
      position:fixed; bottom:28px; right:24px; z-index:100;
      background:rgba(30,111,255,.85); border:2px solid rgba(77,148,255,.5);
      border-radius:50%; width:58px; height:58px;
      font-size:1.4rem; cursor:pointer; color:white;
      box-shadow:0 4px 24px rgba(30,111,255,.5);
      display:none;
    }

    /* ── HINT ── */
    #hint {
      position:fixed; bottom:32px; left:0; right:80px; z-index:50;
      text-align:center; font-size:.75rem;
      color:rgba(255,255,255,.5); letter-spacing:1px;
      font-family:Arial,sans-serif; pointer-events:none; display:none;
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════
     SCENE WRAPPER — gives A-Frame explicit dimensions
     This is the fix for the black screen on Android
══════════════════════════════════════════════ -->
<div id="scene-wrap">
<a-scene
  embedded
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  renderer="antialias: true; logarithmicDepthBuffer: true; colorManagement: true; physicallyCorrectLights: true;"
  device-orientation-permission-ui="enabled: false"
>

  <!-- ASSETS -->
  <a-assets timeout="20000">
    <a-asset-item id="m-athlete" src="models/athlete.glb"></a-asset-item>
    <a-asset-item id="m-logo"    src="models/logo.glb"></a-asset-item>
    <a-asset-item id="m-trophy"  src="models/test-model.glb"></a-asset-item>
    <audio id="music" src="audio/megha-theme.mp3" preload="auto" loop></audio>
  </a-assets>

  <!-- Sky -->
  <a-sky color="#C8D8DC"></a-sky>

  <!-- Ground -->
  <a-plane position="0 0 0" rotation="-90 0 0"
           width="60" height="60" color="#5cb88a"
           shadow="receive:true"></a-plane>

  <!-- Lights -->
  <a-light type="ambient"     color="#fff" intensity="0.8"></a-light>
  <a-light type="directional" color="#fff" intensity="1.0"
           position="-1 4 2" shadow="cast:true"></a-light>

  <!-- ════════════════════════════════════════
       ALL 3 MODELS arranged in a fan shape
       so user sees all of them at once
       when they open the page.

       ATHLETE  — centre front  (0, 0, -2.5)
       LOGO     — right front   (1.8, 0, -2.5)
       TROPHY   — left front    (-1.8, 0, -2.5)

       Scale 0.9 = roughly human height,
       close enough to see detail.
  ════════════════════════════════════════ -->

  <!-- CENTRE — Animated Blue Athlete -->
  <a-entity
    id="athlete"
    gltf-model="#m-athlete"
    position="0 0 -2.5"
    scale="0.9 0.9 0.9"
    rotation="0 0 0"
    animation-mixer="clip:*; loop:repeat; crossFadeDuration:0.3; timeScale:1"
    shadow="cast:true"
  ></a-entity>

  <!-- RIGHT — Logo -->
  <a-entity
    id="logo"
    gltf-model="#m-logo"
    position="1.8 0 -2.5"
    scale="0.8 0.8 0.8"
    rotation="0 -20 0"
    shadow="cast:true"
  ></a-entity>

  <!-- LEFT — Trophy (slowly spinning) -->
  <a-entity
    id="trophy"
    gltf-model="#m-trophy"
    position="-1.8 0 -2.5"
    scale="0.8 0.8 0.8"
    rotation="0 20 0"
    animation="property:rotation; to:0 380 0; loop:true; dur:6000; easing:linear"
    shadow="cast:true"
  ></a-entity>

  <!-- Floating MEGHA HOUSE text -->
  <a-text value="MEGHA HOUSE" align="center"
          position="0 2.5 -2.5" color="#1E6FFF" width="4.5"></a-text>

  <!-- CAMERA at eye level — tilt phone to look around -->
  <a-entity
    camera
    look-controls="magicWindowTrackingEnabled:true; touchEnabled:true; mouseEnabled:true"
    wasd-controls="enabled:false"
    position="0 1.6 0"
  ></a-entity>

</a-scene>
</div><!-- end scene-wrap -->

<!-- ══════ OVERLAYS ══════ -->
<div id="geo-overlay">
  <h2>🏆 MEGHA HOUSE</h2>
  <div class="spin"></div>
  <p id="gstatus">Verifying your location…<br>Please allow GPS access.</p>
</div>

<div id="denied">
  <h2>❌ Access Denied</h2>
  <p>You must be at Obbegoda Secondary School.</p>
  <div class="km" id="kdist"></div>
  <p>Come to the school and try again! 📍</p>
</div>

<div id="topbar">
  <span>MEGHA HOUSE</span>
  <div class="dot"></div>
</div>

<button id="mbtn" onclick="toggleMusic()">🔊</button>
<div id="hint">🔄 Tilt &amp; rotate your phone to look around</div>

<!-- ══════ JS ══════ -->
<script>
// ─────────────────────────────────────────────────
//  ⚠️  PUT YOUR SCHOOL GPS HERE
//  Google Maps → right-click school → "What's here?"
// ─────────────────────────────────────────────────
const LAT    = 6.926289;   // ← replace
const LNG    = 81.350763;  // ← replace
const RADIUS = 999999;      // metres

const mus = document.getElementById('music');
let playing = false;

function toggleMusic() {
  const b = document.getElementById('mbtn');
  if (playing) { mus.pause(); b.textContent='🔇'; playing=false; }
  else { mus.play().catch(()=>{}); b.textContent='🔊'; playing=true; }
}

function dist(la1,lo1,la2,lo2) {
  const R=6371000, r=Math.PI/180;
  const a = Math.sin((la2-la1)*r/2)**2 +
    Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function reveal() {
  const ov = document.getElementById('geo-overlay');
  ov.classList.add('gone');
  setTimeout(()=>{ ov.style.display='none'; }, 750);

  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('mbtn').style.display   = 'block';
  document.getElementById('hint').style.display   = 'block';

  // Trigger A-Frame resize so canvas fills the wrapper properly
  setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 100);

  // Autoplay music — works after any user interaction
  const tryPlay = ()=>{
    mus.play().then(()=>{ playing=true; }).catch(()=>{});
  };
  tryPlay();
  document.body.addEventListener('click', tryPlay, { once:true });
}

function deny(m) {
  document.getElementById('geo-overlay').style.display='none';
  document.getElementById('denied').style.display='flex';
  document.getElementById('kdist').textContent='You are '+Math.round(m)+' metres away.';
}

// Geo check
if (!navigator.geolocation) {
  setTimeout(reveal, 800);
} else {
  navigator.geolocation.getCurrentPosition(
    p => {
      const d = dist(p.coords.latitude, p.coords.longitude, LAT, LNG);
      console.log('Distance: '+d.toFixed(0)+'m');
      d <= RADIUS
        ? (document.getElementById('gstatus').textContent='✅ Verified! Loading…', setTimeout(reveal,1000))
        : deny(d);
    },
    () => { setTimeout(reveal, 800); },
    { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
  );
}

// Re-apply animation-mixer after each model loads
['athlete','logo','trophy'].forEach(id => {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('model-loaded', function() {
    console.log(id+' loaded');
    if (id === 'athlete') {
      this.setAttribute('animation-mixer',
        'clip:*; loop:repeat; crossFadeDuration:0.3; timeScale:1');
    }
  });
  el.addEventListener('model-error', function() {
    console.warn(id+' failed to load — check file name/path');
  });
});
</script>
</body>
</html>
