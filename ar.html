<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Megha House AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* A-Frame canvas fills the screen always */
    a-scene { position: fixed; inset: 0; width: 100% !important; height: 100% !important; }

    /* ── OVERLAYS sit ON TOP of the scene ── */

    /* GEO OVERLAY */
    #geo-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #060C1A;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 30px;
      color: white;
      transition: opacity 0.8s ease;
    }
    #geo-overlay.fade-out { opacity: 0; pointer-events: none; }
    #geo-overlay h2 {
      font-size: 2.2rem; font-weight: 900; letter-spacing: 4px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1E6FFF, #FFD700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    #geo-overlay p {
      color: rgba(255,255,255,0.55); font-size: 0.95rem;
      font-family: Arial, sans-serif; line-height: 1.7; margin-top: 12px;
    }
    .spinner {
      width: 54px; height: 54px;
      border: 3px solid rgba(30,111,255,0.25);
      border-top-color: #1E6FFF;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* DENIED OVERLAY */
    #denied-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #060C1A;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 30px; color: white;
      font-family: Arial, sans-serif;
    }
    #denied-overlay h2 { font-size: 2rem; color: #FF4B4B; margin-bottom: 14px; }
    #denied-overlay p { color: rgba(255,255,255,0.6); line-height: 1.7; font-size: 0.95rem; }
    #denied-dist { font-size: 1.5rem; font-weight: 700; color: #FFD700; margin: 12px 0; }

    /* TOP BAR */
    #ar-ui {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      padding: 14px 20px;
      display: none; justify-content: space-between; align-items: center;
      background: linear-gradient(to bottom, rgba(6,12,26,0.85), transparent);
      font-family: Arial, sans-serif;
      pointer-events: none;
    }
    .house-name { font-weight: 900; font-size: 1rem; color: white; letter-spacing: 3px; }
    .live-dot {
      width: 9px; height: 9px; background: #00E676;
      border-radius: 50%; animation: blink 1.5s ease infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.2; } }

    /* MUSIC BUTTON */
    #music-btn {
      position: fixed; bottom: 28px; right: 24px; z-index: 100;
      background: rgba(30,111,255,0.85);
      border: 2px solid rgba(77,148,255,0.5);
      border-radius: 50%; width: 58px; height: 58px;
      font-size: 1.5rem; cursor: pointer; color: white;
      box-shadow: 0 4px 24px rgba(30,111,255,0.5);
      display: none;
    }

    /* HINT */
    #hint {
      position: fixed; bottom: 32px; left: 0; right: 80px; z-index: 50;
      text-align: center; font-size: 0.78rem;
      color: rgba(255,255,255,0.5); letter-spacing: 1px;
      font-family: Arial, sans-serif;
      pointer-events: none; display: none;
    }
  </style>
</head>
<body>

<!-- ══════ THE 3D SCENE — always in DOM, NEVER hidden ══════
     The geo overlay sits ON TOP. Scene renders behind it.
     This fixes the black screen bug completely.
══════ -->
<a-scene
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
  renderer="antialias: true; logarithmicDepthBuffer: true; colorManagement: true;"
  device-orientation-permission-ui="enabled: false"
>

  <a-assets timeout="20000">
    <a-asset-item id="athlete-model" src="models/athlete.glb"></a-asset-item>
    <a-asset-item id="logo-model"    src="models/logo.glb"></a-asset-item>
    <a-asset-item id="trophy-model"  src="models/trophy.glb"></a-asset-item>
    <audio id="bg-music" src="audio/megha-theme.mp3" preload="auto" loop></audio>
  </a-assets>

  <!-- Sky (light grey like aframe.io/examples) -->
  <a-sky color="#C8D8DC"></a-sky>

  <!-- Ground (teal-green like aframe.io/examples) -->
  <a-plane
    position="0 0 0" rotation="-90 0 0"
    width="60" height="60" color="#5cb88a"
    shadow="receive: true"
  ></a-plane>

  <!-- Lights -->
  <a-light type="ambient"     color="#ffffff" intensity="0.75"></a-light>
  <a-light type="directional" color="#ffffff" intensity="1.1"
           position="-1 3 1" shadow="cast: true"></a-light>

  <!-- ═══ NORTH — Main Blue Athlete (animated) ═══ -->
  <a-entity
    id="athlete"
    gltf-model="#athlete-model"
    position="0 0 -3"
    scale="1.5 1.5 1.5"
    rotation="0 0 0"
    animation-mixer="clip: *; loop: repeat; crossFadeDuration: 0.3"
    shadow="cast: true"
  ></a-entity>

  <!-- ═══ EAST — Logo ═══ -->
  <a-entity
    gltf-model="#logo-model"
    position="3 0.5 -2"
    scale="1 1 1"
    rotation="0 -45 0"
    shadow="cast: true"
  ></a-entity>

  <!-- ═══ WEST — Trophy (slowly spinning) ═══ -->
  <a-entity
    gltf-model="#trophy-model"
    position="-3 0 -2"
    scale="1 1 1"
    rotation="0 45 0"
    animation="property: rotation; to: 0 405 0; loop: true; dur: 5000; easing: linear"
    shadow="cast: true"
  ></a-entity>

  <!-- Floating text above athlete -->
  <a-text
    value="MEGHA HOUSE"
    align="center"
    position="0 2.8 -3"
    color="#1E6FFF"
    width="5"
  ></a-text>

  <!-- Camera: tilt phone to look around -->
  <a-entity
    camera
    look-controls="magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true"
    wasd-controls="enabled: false"
    position="0 1.6 0"
  ></a-entity>

</a-scene>

<!-- ══════ OVERLAYS ══════ -->

<div id="geo-overlay">
  <h2>🏆 MEGHA HOUSE</h2>
  <div class="spinner"></div>
  <p id="geo-status">Verifying your location...<br>Please allow GPS access.</p>
</div>

<div id="denied-overlay">
  <h2>❌ Access Denied</h2>
  <p>You must be at Obbegoda Secondary School.</p>
  <div id="denied-dist"></div>
  <p>Come to the school and try again! 📍</p>
</div>

<div id="ar-ui">
  <span class="house-name">MEGHA HOUSE</span>
  <div class="live-dot"></div>
</div>

<button id="music-btn" onclick="toggleMusic()">🔊</button>
<div id="hint">🔄 Move your phone to look around</div>

<!-- ══════ JAVASCRIPT ══════ -->
<script>
  // ─────────────────────────────────────────────
  //  ⚠️ CHANGE THESE TO YOUR SCHOOL'S REAL GPS
  //  Google Maps → right-click → "What's here?"
  // ─────────────────────────────────────────────
  const SCHOOL_LAT = 6.926289;   // ← replace this
  const SCHOOL_LNG = 81.350763;  // ← replace this
  const RADIUS_M   = 999999;

  const audio = document.getElementById('bg-music');
  let musicOn = false;

  function toggleMusic() {
    const btn = document.getElementById('music-btn');
    if (musicOn) {
      audio.pause(); btn.textContent = '🔇'; musicOn = false;
    } else {
      audio.play().catch(()=>{}); btn.textContent = '🔊'; musicOn = true;
    }
  }

  function haversine(la1, lo1, la2, lo2) {
    const R = 6371000, r = Math.PI / 180;
    const dLa = (la2-la1)*r, dLo = (lo2-lo1)*r;
    const a = Math.sin(dLa/2)**2 +
              Math.cos(la1*r) * Math.cos(la2*r) * Math.sin(dLo/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function showScene() {
    // Fade out the overlay — 3D was already rendering behind it!
    const ov = document.getElementById('geo-overlay');
    ov.classList.add('fade-out');
    setTimeout(() => { ov.style.display = 'none'; }, 850);

    document.getElementById('ar-ui').style.display    = 'flex';
    document.getElementById('music-btn').style.display = 'block';
    document.getElementById('hint').style.display      = 'block';

    // Tell A-Frame to recalculate canvas size
    window.dispatchEvent(new Event('resize'));

    // Start music on first tap (required by mobile browsers)
    document.body.addEventListener('click', function once() {
      if (!musicOn) {
        audio.play().then(() => { musicOn = true; }).catch(() => {});
      }
      document.body.removeEventListener('click', once);
    }, { once: true });

    // Also try immediate autoplay
    audio.play().then(() => { musicOn = true; }).catch(() => {});
  }

  function showDenied(dist) {
    document.getElementById('geo-overlay').style.display = 'none';
    document.getElementById('denied-overlay').style.display = 'flex';
    document.getElementById('denied-dist').textContent =
      'You are ' + Math.round(dist) + ' metres away.';
  }

  function geoCheck() {
    if (!navigator.geolocation) {
      document.getElementById('geo-status').textContent =
        'GPS not available. Loading demo...';
      setTimeout(showScene, 1500);
      return;
    }
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        const d = haversine(
          pos.coords.latitude, pos.coords.longitude,
          SCHOOL_LAT, SCHOOL_LNG
        );
        console.log('Distance: ' + d.toFixed(1) + 'm');
        if (d <= RADIUS_M) {
          document.getElementById('geo-status').textContent =
            '✅ Location verified! Loading...';
          setTimeout(showScene, 1000);
        } else {
          showDenied(d);
        }
      },
      function() {
        document.getElementById('geo-status').textContent =
          'Location error. Loading demo...';
        setTimeout(showScene, 1500);
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
  }

  // Re-trigger animation after model loads
  document.getElementById('athlete').addEventListener('model-loaded', function() {
    console.log('Athlete loaded — playing animation');
    this.setAttribute('animation-mixer',
      'clip: *; loop: repeat; crossFadeDuration: 0.3');
  });

  // Start geo check
  geoCheck();
</script>

</body>
</html>
