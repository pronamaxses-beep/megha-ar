<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Megha House AR</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- AR.js — gives us the camera feed (real world background) -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100vw; height:100vh; overflow:hidden; background:#000; }

    /* ── A-Frame scene always fills the screen ── */
    a-scene {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
    }
    /* Force the WebGL canvas AND the video (camera feed) to fill screen */
    a-scene canvas,
    #arjs-video,
    .arjs-loader,
    video {
      position: fixed !important;
      top: 0 !important; left: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }

    /* ── GEO OVERLAY — sits on top of camera ── */
    #geo-overlay {
      position: fixed; inset: 0; z-index: 999;
      background: #060C1A;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 30px; color: white;
      font-family: Arial, sans-serif;
      transition: opacity 0.7s ease;
    }
    #geo-overlay.gone { opacity:0; pointer-events:none; }
    #geo-overlay h2 {
      font-size: 2rem; font-weight: 900; letter-spacing: 4px;
      background: linear-gradient(135deg, #1E6FFF, #FFD700);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    #geo-overlay p { color:rgba(255,255,255,.55); font-size:.9rem; line-height:1.7; margin-top:10px; }
    .spin {
      width:50px; height:50px; margin:18px auto;
      border:3px solid rgba(30,111,255,.2);
      border-top-color:#1E6FFF; border-radius:50%;
      animation:spin 1s linear infinite;
    }
    @keyframes spin { to{ transform:rotate(360deg); } }

    /* ── DENIED ── */
    #denied {
      position:fixed; inset:0; z-index:999; background:#060C1A;
      color:white; display:none; flex-direction:column;
      align-items:center; justify-content:center;
      text-align:center; padding:30px; font-family:Arial,sans-serif;
    }
    #denied h2 { color:#FF4B4B; font-size:2rem; margin-bottom:14px; }
    #denied p  { color:rgba(255,255,255,.6); line-height:1.7; }
    #denied .km { font-size:1.5rem; font-weight:700; color:#FFD700; margin:12px 0; }

    /* ── TOP BAR ── */
    #topbar {
      position:fixed; top:0; left:0; right:0; z-index:200;
      padding:14px 20px;
      display:none; justify-content:space-between; align-items:center;
      background:linear-gradient(to bottom, rgba(6,12,26,.8), transparent);
      font-family:Arial,sans-serif; pointer-events:none;
    }
    #topbar span { font-weight:900; font-size:1rem; color:white; letter-spacing:3px; }
    .dot { width:9px; height:9px; background:#00E676; border-radius:50%;
           animation:blink 1.5s ease infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* ── MUSIC BUTTON ── */
    #mbtn {
      position:fixed; bottom:28px; right:24px; z-index:200;
      background:rgba(30,111,255,.85);
      border:2px solid rgba(77,148,255,.5);
      border-radius:50%; width:58px; height:58px;
      font-size:1.4rem; cursor:pointer; color:white;
      box-shadow:0 4px 24px rgba(30,111,255,.5);
      display:none;
    }

    /* ── HINT ── */
    #hint {
      position:fixed; bottom:32px; left:0; right:80px; z-index:200;
      text-align:center; font-size:.75rem;
      color:rgba(255,255,255,.7); letter-spacing:1px;
      font-family:Arial,sans-serif; pointer-events:none; display:none;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════════════════════════
     TRUE AR SCENE
     - AR.js gives us the phone CAMERA as background
     - 3D models float on top of the real world
     - Scene is ALWAYS in the DOM (never hidden)
       → This is what fixes the black screen bug
     - Geo overlay sits on top until GPS check passes
══════════════════════════════════════════════════ -->
<a-scene
  embedded
  arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
  renderer="antialias: true; logarithmicDepthBuffer: true;"
  vr-mode-ui="enabled: false"
  loading-screen="enabled: false"
>

  <!-- ASSETS -->
  <a-assets timeout="20000">
    <a-asset-item id="m-athlete" src="models/athlete.glb"></a-asset-item>
    <a-asset-item id="m-logo"    src="models/logo.glb"></a-asset-item>
    <a-asset-item id="m-test"    src="models/test-model.glb"></a-asset-item>
    <audio id="music" src="audio/megha-theme.mp3" preload="auto" loop></audio>
  </a-assets>

  <!-- ════ MODELS — all 3 visible in front of camera ════

       Layout (top view):
           [test-model]  [athlete]  [logo]
              -2m          0m        +2m
           all at -3m in front of camera

       Scale 1.0 = human-height character
  ════ -->

  <!-- CENTRE — Animated Blue Athlete -->
  <a-entity
    id="athlete"
    gltf-model="#m-athlete"
    position="0 -1 -3"
    scale="1 1 1"
    rotation="0 0 0"
    animation-mixer="clip:*; loop:repeat; crossFadeDuration:0.3; timeScale:1"
  ></a-entity>

  <!-- RIGHT — Logo model -->
  <a-entity
    id="logo"
    gltf-model="#m-logo"
    position="2 -1 -3"
    scale="1 1 1"
    rotation="0 -20 0"
  ></a-entity>

  <!-- LEFT — Test model (slowly spinning) -->
  <a-entity
    id="test"
    gltf-model="#m-test"
    position="-2 -1 -3"
    scale="1 1 1"
    rotation="0 20 0"
    animation="property:rotation; from:0 20 0; to:0 380 0; loop:true; dur:6000; easing:linear"
  ></a-entity>

  <!-- Floating text above athlete -->
  <a-text
    value="MEGHA HOUSE"
    align="center"
    position="0 1.2 -3"
    color="#1E6FFF"
    width="4"
  ></a-text>

  <!-- Camera (required for AR.js) -->
  <a-entity camera></a-entity>

</a-scene>

<!-- ══════ OVERLAYS ══════ -->
<div id="geo-overlay">
  <h2>🏆 MEGHA HOUSE</h2>
  <div class="spin"></div>
  <p id="gstatus">Verifying your location…<br>Please allow GPS &amp; Camera access.</p>
</div>

<div id="denied">
  <h2>❌ Access Denied</h2>
  <p>You must be at Obbegoda Secondary School.</p>
  <div class="km" id="kdist"></div>
  <p>Come to the school and try again! 📍</p>
</div>

<div id="topbar">
  <span>MEGHA HOUSE</span>
  <div class="dot"></div>
</div>

<button id="mbtn" onclick="toggleMusic()">🔊</button>
<div id="hint">📷 Point your camera at the ground to see the AR characters!</div>

<!-- ══════ JS ══════ -->
<script>
  // ─────────────────────────────────────────────────
  //  ⚠️  PUT YOUR SCHOOL GPS COORDINATES HERE
  //  Google Maps → right-click school → "What's here?"
  // ─────────────────────────────────────────────────
  const LAT    = 6.926289;   // ← replace with real latitude
  const LNG    = 81.350763;  // ← replace with real longitude
  const RADIUS = 999999;      // metres

  const mus = document.getElementById('music');
  let playing = false;

  function toggleMusic() {
    const b = document.getElementById('mbtn');
    if (playing) { mus.pause(); b.textContent='🔇'; playing=false; }
    else { mus.play().catch(()=>{}); b.textContent='🔊'; playing=true; }
  }

  function distM(la1,lo1,la2,lo2) {
    const R=6371000, r=Math.PI/180;
    const a = Math.sin((la2-la1)*r/2)**2 +
      Math.cos(la1*r)*Math.cos(la2*r)*Math.sin((lo2-lo1)*r/2)**2;
    return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  }

  function reveal() {
    const ov = document.getElementById('geo-overlay');
    ov.classList.add('gone');
    setTimeout(()=>{ ov.style.display='none'; }, 800);

    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('mbtn').style.display   = 'block';
    document.getElementById('hint').style.display   = 'block';

    // Force canvas resize after overlay removed
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 200);
    setTimeout(()=>{ window.dispatchEvent(new Event('resize')); }, 600);

    // Start music
    const tryPlay = () => {
      mus.play().then(()=>{ playing=true; }).catch(()=>{});
    };
    tryPlay();
    document.body.addEventListener('click', tryPlay, { once:true });
  }

  function deny(m) {
    document.getElementById('geo-overlay').style.display = 'none';
    document.getElementById('denied').style.display = 'flex';
    document.getElementById('kdist').textContent =
      'You are ' + Math.round(m) + ' metres away.';
  }

  // ── Geo check ──
  if (!navigator.geolocation) {
    setTimeout(reveal, 800);
  } else {
    navigator.geolocation.getCurrentPosition(
      function(p) {
        const d = distM(p.coords.latitude, p.coords.longitude, LAT, LNG);
        console.log('Distance: ' + d.toFixed(0) + 'm');
        if (d <= RADIUS) {
          document.getElementById('gstatus').textContent = '✅ Verified! Loading AR…';
          setTimeout(reveal, 1000);
        } else {
          deny(d);
        }
      },
      function() {
        // GPS error → still load (demo mode)
        setTimeout(reveal, 800);
      },
      { enableHighAccuracy:true, timeout:12000, maximumAge:0 }
    );
  }

  // ── Re-apply animation after models load ──
  document.getElementById('athlete').addEventListener('model-loaded', function() {
    console.log('athlete loaded ✅');
    this.setAttribute('animation-mixer',
      'clip:*; loop:repeat; crossFadeDuration:0.3; timeScale:1');
  });
  document.getElementById('logo').addEventListener('model-loaded', function() {
    console.log('logo loaded ✅');
  });
  document.getElementById('test').addEventListener('model-loaded', function() {
    console.log('test-model loaded ✅');
  });
</script>

</body>
</html>
